<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>New House Command Center</title>
  <meta name="description" content="Move-in tracker for 2608 Montrose Blvd.">
  <meta name="theme-color" content="#1d1a17">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231d1a17'/%3E%3Cpath d='M14 34 32 18l18 16v14H38V38H26v10H14z' fill='%23d08a52'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#dashboard">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 64 64"><path d="M14 34 32 18l18 16v14H38V38H26v10H14z" fill="currentColor"/></svg>
      </span>
      <span class="brand-text">
        <strong>2608 Montrose</strong>
        <small>New House Command Center</small>
      </span>
    </a>
    <nav class="tabs" aria-label="Sections">
      <a href="#dashboard" data-route="dashboard"><svg viewBox="0 0 24 24"><path d="M3 13h8V3H3zm0 8h8v-6H3zm10 0h8V11h-8zm0-18v6h8V3z"/></svg><span>Dashboard</span></a>
      <a href="#tasks" data-route="tasks"><svg viewBox="0 0 24 24"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg><span>Tasks</span></a>
      <a href="#shopping" data-route="shopping"><svg viewBox="0 0 24 24"><path d="M7 18a2 2 0 1 0 0 4 2 2 0 0 0 0-4m10 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4M7.2 14h9.5c.8 0 1.4-.4 1.8-1l3.5-6.5L20.3 5.5 16.7 12H8.5L4.3 3H1v2h2l3.6 7.6L5.2 15c-.7 1.3.2 3 1.8 3h12v-2H7z"/></svg><span>Shopping</span></a>
      <a href="#home" data-route="home"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span>Home Info</span></a>
      <a href="#files" data-route="files"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16c0 1.1.9 2 2 2h12a2 2 0 0 0 2-2V8zm-1 7V3.5L18.5 9zM8 13h8v2H8zm0 4h8v2H8z"/></svg><span>Files</span></a>
      <a href="#settings" data-route="settings"><svg viewBox="0 0 24 24"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7 7 0 0 0-1.7-1L15 3h-4l-.4 2.7a7 7 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7 7 0 0 0 1.7 1L11 21h4l.4-2.7a7 7 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg><span>Settings</span></a>
    </nav>
    <span class="sync-badge" id="sync-badge" data-mode="off" role="status" aria-live="polite"><span class="dot" aria-hidden="true"></span><span id="sync-label">This device only</span></span>
  </header>

  <main id="view" tabindex="-1"></main>

  <dialog id="modal" class="modal"></dialog>
  <dialog id="confirm" class="modal confirm">
    <form method="dialog">
      <h3 id="confirm-title">Are you sure?</h3>
      <p id="confirm-body"></p>
      <div class="modal-actions">
        <button value="cancel" class="btn ghost">Keep it</button>
        <button value="ok" class="btn danger" id="confirm-ok">Yes, do it</button>
      </div>
    </form>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
